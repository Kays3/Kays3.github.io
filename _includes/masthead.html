{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button type="button" aria-label="Open navigation menu" aria-controls="site-nav-links" aria-expanded="false"><span class="navicon" aria-hidden="true"></span></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist {% if page.url == '/' or page.url == '/index.html' %}selected{% endif %}">
            <a href="{{ base_path }}/">{{ site.title }}</a>
          </li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item {% if page.url contains link.url and link.url != '/' %}selected{% endif %}">
              <a href="{{ domain }}{{ link.url }}">{{ link.title }}</a>
            </li>
          {% endfor %}
        </ul>
        <ul id="site-nav-links" class="hidden-links hidden"></ul>
      </nav>
    </div>
    <button type="button" id="theme-toggle" class="theme-switch" role="switch" aria-checked="false" aria-label="Night mode"><span class="theme-switch__track" aria-hidden="true"><span class="theme-switch__sun">&#x2600;</span><span class="theme-switch__moon">&#x263E;</span><span class="theme-switch__knob"></span></span><span class="theme-switch__label" aria-hidden="true">Night</span></button>
    <script>
      (function () {
        var root = document.documentElement, sw = document.getElementById('theme-toggle');
        if (!sw) { return; }
        function sync() { sw.setAttribute('aria-checked', root.getAttribute('data-theme') === 'dark' ? 'true' : 'false'); }
        sync();
        if (window.MutationObserver) { new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ['data-theme'] }); }
      })();
    </script>
  </div>
</div>
