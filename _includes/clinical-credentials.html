{% assign clinical_language = page.lang | default: 'en' %}{% assign credentials = site.data.clinical_credentials[clinical_language] %}
<dl class="specialty-facts" aria-label="{{ credentials.heading }}">
{% for key in site.data.clinical_credential_fields %}<div><dt>{{ credentials[key] }}</dt>{% assign body_key = key | append: '_body' %}<dd>{{ credentials[body_key] }}</dd></div>{% endfor %}
</dl>
