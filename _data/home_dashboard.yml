# Home page dashboard. Every number is taken from the publication record, the thesis, or the CV.
# Dates given only as years in the CV are drawn at mid-year (x.5); months are used where the CV gives them.
shared:
  axis_start: 2010
  axis_end: 2027
  axis_ticks: [2010, 2015, 2020, 2025]
  papers_max: 4
  papers:
    - { year: 2018, n: 1 }
    - { year: 2019, n: 1 }
    - { year: 2020, n: 3 }
    - { year: 2021, n: 0 }
    - { year: 2022, n: 1 }
    - { year: 2023, n: 0 }
    - { year: 2024, n: 0, thesis: true }
    - { year: 2025, n: 4 }
    - { year: 2026, n: 1 }
  stats:
    - { key: papers, value: 11, url: "/publications/" }
    - { key: patients, value: 150, url: "/research/#infectious-disease" }
    - { key: isolates, value: 86, url: "/research/#infectious-disease" }
    - { key: interviews, value: 60, url: "/research/#clinical-systems" }
    - { key: transcriptomes, value: 72, url: "/research/#ocean-acidification" }
  lanes:
    - key: kz
      spans: [{ s: 2010.5, e: 2019.5 }, { s: 2023.92, e: 2026.25 }]
    - key: jp
      spans: [{ s: 2019.5, e: 2024.5 }, { s: 2026.5, e: 2026.86, open: true }]
    - key: au
      points: [2018.5]
    - key: us
      points: [2019.5]
    - key: tw
      spans: [{ s: 2025.25, e: 2025.67 }]
