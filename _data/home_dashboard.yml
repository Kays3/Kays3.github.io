# Text for the two home illustrations (home-anemone.html and home-isp.html).
en:
  pause: "Pause animation"
  play: "Play animation"
  anemone_alt: "Animated painting: tomato, Clark's and pink skunk anemonefish, a three-spot damsel, and a shrimp around a bubble-tip sea anemone, and an ocellaris anemonefish over a carpet anemone. Small transposon blocks pass from a fish to a symbiotic alga and on to an anemone, then back again."
  anemone_caption: "A hypothesis, drawn: transposons passing between anemonefish, symbiotic algae, and their host anemones over evolutionary time. An illustration, not data. Shown: tomato, Clark's and pink skunk anemonefish, a three-spot damsel, and a shrimp at a bubble-tip anemone; an ocellaris at a carpet anemone (<em>Stichodactyla</em>). The backdrop and some animals are AI-generated (Canva); the other fish reuse illustrations from the TE Mobilome Paper project."
  isp_alt: "Animated painting: a row of gene tokens above drifting cells. One token is crossed out and removed, the row closes up, and a glow spreads through a network of genes."
  isp_caption: "Geneformer in silico perturbation, drawn: delete one gene from a cell's ranked list and follow the predicted shift. An illustration, not data. Backdrop AI-generated (Canva)."
ja:
  pause: "アニメーションを停止"
  play: "アニメーションを再生"
  anemone_alt: "アニメーション：サンゴイソギンチャクの周りにクマノミ類3種、ミツボシクロスズメダイ、エビがいて、ハタゴイソギンチャクの仲間の上をカクレクマノミが泳ぎます。転移因子を表す小さなブロックが魚から共生藻へ、さらにイソギンチャクへと移り、また戻ります。"
  anemone_caption: "仮説のイメージ図：進化の過程で、転移因子がクマノミ類、共生藻、宿主イソギンチャクの間を行き来した可能性。データではありません。サンゴイソギンチャクにはハマクマノミ、クマノミ、ハナビラクマノミ、ミツボシクロスズメダイ、エビを、ハタゴイソギンチャクの仲間（<em>Stichodactyla</em>）にはカクレクマノミを描いています。 背景と一部の生き物はAI（Canva）で生成し、ほかの魚はTE Mobilome Paperのイラストを再利用しています。"
  isp_alt: "アニメーション：漂う細胞の上に遺伝子トークンの列が並びます。1つのトークンに×印が付いて取り除かれ、列が詰まり、遺伝子ネットワークに光が広がります。"
  isp_caption: "Geneformerによるin silico摂動のイメージ図：細胞の遺伝子順位リストから1つの遺伝子を取り除き、予測される変化を追います。データではありません。背景はAI（Canva）で生成しました。"
ru:
  pause: "Остановить анимацию"
  play: "Запустить анимацию"
  anemone_alt: "Анимированный рисунок: у пузырчатой актинии плавают три вида рыб-клоунов, трёхпятнистый дасцилл и креветка, а над ковровой актинией — клоун-оцеллярис. Небольшие блоки-транспозоны переходят от рыбы к симбиотической водоросли и дальше к актинии, а затем обратно."
  anemone_caption: "Гипотеза в рисунке: в ходе эволюции транспозоны могли переходить между рыбами-клоунами, симбиотическими водорослями и актиниями-хозяевами. Это иллюстрация, а не данные. У пузырчатой актинии: томатный клоун, клоун Кларка, розовый клоун, трёхпятнистый дасцилл и креветка. У ковровой актинии (<em>Stichodactyla</em>): клоун-оцеллярис. Фон и часть животных созданы с помощью ИИ (Canva); остальные рыбы взяты из иллюстраций проекта TE Mobilome Paper."
  isp_alt: "Анимированный рисунок: над плавающими клетками расположен ряд генных токенов. Один токен зачёркивается и исчезает, ряд смыкается, и по сети генов расходится свечение."
  isp_caption: "Моделирование воздействий в Geneformer в рисунке: из ранжированного списка генов клетки удаляется один ген, и модель предсказывает сдвиг. Это иллюстрация, а не данные. Фон создан с помощью ИИ (Canva)."
kk:
  pause: "Анимацияны тоқтату"
  play: "Анимацияны қосу"
  anemone_alt: "Анимациялық сурет: көпіршікті актинияның маңында клоун-балықтың үш түрі, үш дақты дасцилл және асшаян бар, ал кілем тәрізді актинияның үстінде оцеллярис жүзіп жүр. Транспозондарды бейнелейтін шағын блоктар балықтан симбионт балдырға, одан актинияға өтіп, кейін кері қайтады."
  anemone_caption: "Суретпен берілген болжам: эволюция барысында транспозондар клоун-балықтар, симбионт балдырлар және оларды паналататын актиниялар арасында ауысуы мүмкін. Бұл көркем бейне, дерек емес. Көпіршікті актинияда: қызанақ түсті клоун-балық, Кларк клоун-балығы, қызғылт клоун-балық, үш дақты дасцилл және асшаян. Кілем тәрізді актинияда (<em>Stichodactyla</em>): оцеллярис. Фон мен кейбір жануарлар жасанды интеллект (Canva) арқылы жасалған; қалған балықтар TE Mobilome Paper жобасының суреттерінен алынған."
  isp_alt: "Анимациялық сурет: қалқып жүрген жасушалардың үстінде ген токендерінің қатары тұр. Бір токен сызылып алынып тасталады, қатар жинақталады, ал гендер желісі бойымен жарық тарайды."
  isp_caption: "Geneformer арқылы генге ықпал етуді модельдеу суретпен берілген: жасушаның гендер реттелген тізімінен бір ген алынып тасталады да, модель күйдің өзгерісін болжайды. Бұл көркем бейне, дерек емес. Фон жасанды интеллект (Canva) арқылы жасалған."
